<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>القرآن الكريم</title>
<style>
@font-face{font-family:"Amiri Quran";src:url(fonts/amiri.woff2) format("woff2");font-display:swap}
:root{--bg:#fbf7ec;--fg:#1d2b24;--c:#fff;--g:#0f6b4f;--b:#e4dcc3}
body.d{--bg:#121a17;--fg:#e8eee9;--c:#1b2622;--g:#2f8f70;--b:#2b3a34}
[hidden]{display:none!important}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px system-ui,"Segoe UI",Tahoma,sans-serif;padding-bottom:150px}
header{position:sticky;top:0;background:var(--g);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;justify-content:space-between;align-items:center;z-index:5}
header button{background:none;border:0;font-size:20px;color:#fff}
main{padding:12px;max-width:720px;margin:auto}
.card{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:12px;margin:8px 0}
.sr{display:flex;gap:10px;align-items:center}.sr small{margin-inline-start:auto;opacity:.7}
.go{background:var(--g);color:#fff}
input,select{width:100%;padding:10px;border-radius:10px;border:1px solid var(--b);background:var(--c);color:var(--fg);font:inherit}
.q{font-family:"Amiri Quran","Traditional Arabic",serif;line-height:2.4;text-align:justify;font-size:var(--fs,26px)}
.a{cursor:pointer;border-radius:6px}.a.on{background:#ffd54f55}.n{color:var(--g);font-size:.7em}
.bis{text-align:center;font-family:"Amiri Quran",serif;font-size:28px;margin:10px}
#sheet,#pl,nav{position:fixed;inset-inline:0;background:var(--c);border-top:1px solid var(--b)}
nav{bottom:0;display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav button{flex:1;border:0;background:none;color:var(--fg);padding:10px 2px;font:inherit;font-size:12px}nav .on{color:var(--g);font-weight:700}
#pl{bottom:calc(52px + env(safe-area-inset-bottom));padding:8px;display:flex;gap:8px;align-items:center;z-index:6}
#sheet{bottom:calc(52px + env(safe-area-inset-bottom));max-height:60vh;overflow:auto;padding:14px;z-index:7}
button{font:inherit}.bt{display:flex;gap:6px;flex-wrap:wrap}.bt button,#pl button{padding:8px 12px;border-radius:10px;border:1px solid var(--b);background:var(--bg);color:var(--fg)}
.bt button.on{background:var(--g);color:#fff}
.t{font-family:"Amiri Quran",serif;font-size:22px;line-height:2}
.big{width:200px;height:200px;border-radius:50%;font-size:56px;background:var(--g);color:#fff;border:0;display:block;margin:30px auto}
.c{text-align:center}.z{font-family:"Amiri Quran",serif;font-size:21px;line-height:2}
#ms{position:fixed;bottom:130px;left:50%;transform:translateX(-50%);background:#000c;color:#fff;padding:8px 16px;border-radius:20px;z-index:9}
.hl{background:var(--g);color:#fff}
</style>
<script src="data.js"></script><script src="lib/adhan.js"></script></head><body>
<header><b>القرآن الكريم</b><button onclick="dk()">🌙</button></header>
<main id="main"></main><div id="ms" hidden></div>
<div id="sheet" hidden></div>
<div id="pl" hidden>
<button onclick="st(-1)">⏮</button><button id="pb" onclick="tg()">⏸</button><button onclick="st(1)">⏭</button>
<select id="rc" onchange="S.rec=this.value;save();pq&&go();if(cur)dlLabel()">
<option value="ar.alafasy">مشاري العفاسي</option><option value="ar.husary">الحصري</option>
<option value="ar.minshawi">المنشاوي</option><option value="ar.abdulbasitmurattal">عبد الباسط (مرتل)</option>
<option value="ar.abdurrahmaansudais">السديس</option><option value="ar.mahermuaiqly">ماهر المعيقلي</option></select></div>
<nav>
<button data-v="home" onclick="nav('home')">📖<br>المصحف</button>
<button data-v="search" onclick="nav('search')">🔍<br>بحث</button>
<button data-v="azkar" onclick="nav('azkar')">🤲<br>أذكار</button>
<button data-v="times" onclick="nav('times')">🕌<br>المواقيت</button>
<button data-v="tasbih" onclick="nav('tasbih')">📿<br>مسبحة</button></nav>
<script>
const $=s=>document.querySelector(s);
let S={};try{S=JSON.parse(localStorage.q||'{}')}catch(e){}
const save=()=>{try{localStorage.q=JSON.stringify(S)}catch(e){}};
const ar=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
const nz=t=>t.replace(/[\u064B-\u065F\u0670\u0640\u06D6-\u06ED]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي');
const toast=t=>{const e=$('#ms');e.textContent=t;e.hidden=false;clearTimeout(toast.i);toast.i=setTimeout(()=>e.hidden=true,2600)};
let cur=null,pq=null,qi=-1,ht='s';const au=new Audio();
function dk(){S.d=!S.d;save();document.body.classList.toggle('d',!!S.d)}
function fs(d){S.fs=Math.max(18,Math.min(50,(S.fs||26)+d));save();document.documentElement.style.setProperty('--fs',S.fs+'px')}
document.body.classList.toggle('d',!!S.d);document.documentElement.style.setProperty('--fs',(S.fs||26)+'px');$('#rc').value=S.rec||'ar.alafasy';
function nav(v){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v==v));$('#sheet').hidden=true;scrollTo(0,0);({home,search,azkar,times,tasbih})[v]()}
function home(t){if(typeof t=='string')ht=t;let h='';
if(S.last)h+=`<div class="card go" onclick="openS(${S.last.s},${S.last.a})">📖 متابعة القراءة: ${D[S.last.s-1].name} — آية ${ar(S.last.a)}</div>`;
if(S.bm&&S.bm.length)h+='<h3>⭐ المحفوظات</h3>'+S.bm.map(b=>`<div class=card onclick="openS(${b.s},${b.a})">${D[b.s-1].name} — آية ${ar(b.a)}</div>`).join('');
h+=`<div class=bt style="margin:8px 0"><button class="${ht=='s'?'on':''}" onclick="home('s')">السور</button><button class="${ht=='j'?'on':''}" onclick="home('j')">الأجزاء</button></div>`;
if(ht=='s')h+='<input placeholder="ابحث عن سورة…" oninput="fl(this.value)">'+D.map(s=>`<div class="card sr" data-n="${nz(s.name)}" onclick="openS(${s.n})"><b>${ar(s.n)}</b><span>${s.name}</span><small>${s.t?'مكية':'مدنية'} · ${ar(s.a.length)} آية</small></div>`).join('');
else{const J={};D.forEach(s=>s.a.forEach((a,i)=>{if(!J[a[2]])J[a[2]]=[s.n,i+1]}));h+=Object.keys(J).map(j=>`<div class="card sr" onclick="openS(${J[j][0]},${J[j][1]})"><b>${ar(j)}</b><span>الجزء ${ar(j)}</span><small>${D[J[j][0]-1].name} ${ar(J[j][1])}</small></div>`).join('')}
$('#main').innerHTML=h}
function fl(v){v=nz(v.trim());document.querySelectorAll('.sr').forEach(e=>e.hidden=!e.dataset.n.includes(v))}
function openS(n,a){scrollTo(0,0);const s=D[n-1];cur={n,ay:s.a};
$('#main').innerHTML=`<div class=bt><button onclick="home()">→ رجوع</button><button onclick="fs(2)">أ+</button><button onclick="fs(-2)">أ-</button><button onclick="play(${a?a-1:0},1)">▶️ تشغيل السورة</button><button id=dlb onclick="dl(${n})"></button></div><h2 class=c>${s.name}</h2><p class=c style="opacity:.7;margin:0">الجزء ${ar(s.a[0][2])}</p>`+(n!=1&&n!=9?'<div class=bis>بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ</div>':'')+'<div class=q>'+s.a.map((x,i)=>`<span class=a id=a${i} onclick="sh(${i})">${x[0]} <span class=n>﴿${ar(i+1)}﴾</span></span> `).join('')+'</div>';
dlLabel();if(a){const e=document.getElementById('a'+(a-1));e&&e.scrollIntoView({block:'center'})}}
function sh(i){const a=cur.ay[i];S.last={s:cur.n,a:i+1};save();
const s=$('#sheet');s.hidden=false;s.innerHTML=`<p class=t>${a[0]}</p><p><b>التفسير الميسر:</b><br>${a[1]}</p><div class=bt><button onclick="play(${i})">▶️ استماع</button><button onclick="bm(${i})">⭐ حفظ</button><button onclick="cp(${i})">📋 نسخ</button><button onclick="$('#sheet').hidden=true">✖</button></div>`}
function bm(i){S.bm=S.bm||[];const k=S.bm.findIndex(b=>b.s==cur.n&&b.a==i+1);k<0?S.bm.push({s:cur.n,a:i+1}):S.bm.splice(k,1);save();$('#sheet').hidden=true;toast(k<0?'تم الحفظ ⭐':'تم الحذف من المحفوظات')}
function cp(i){try{navigator.clipboard.writeText(cur.ay[i][0])}catch(e){}$('#sheet').hidden=true;toast('تم النسخ')}
/* ===== الصوت (تشغيل + تحميل للأوفلاين) ===== */
const rec=()=>S.rec||'ar.alafasy',url=g=>`https://cdn.islamic.network/quran/audio/128/${rec()}/${g}.mp3`;
let bu=null;
async function src(g){const u=url(g);try{const c=await caches.open('aud'),r=await c.match(u);if(r){if(bu)URL.revokeObjectURL(bu);return bu=URL.createObjectURL(await r.blob())}}catch(e){}return u}
function play(i){pq=cur;qi=i;$('#sheet').hidden=true;go()}
async function go(){const a=pq.ay[qi];au.src=await src(a[4]);au.play().catch(()=>{});$('#pl').hidden=false;$('#pb').textContent='⏸';
document.querySelectorAll('.a.on').forEach(e=>e.classList.remove('on'));
if(cur&&cur.n==pq.n){const e=document.getElementById('a'+qi);e&&(e.classList.add('on'),e.scrollIntoView({block:'center',behavior:'smooth'}))}}
au.onended=()=>{if(pq&&qi<pq.ay.length-1){qi++;go()}else $('#pb').textContent='▶️'};
au.onerror=()=>{$('#pb').textContent='▶️';toast('الصوت مش محمّل — حمّل السورة أو اتصل بالإنترنت')};
function tg(){if(au.paused){au.play();$('#pb').textContent='⏸'}else{au.pause();$('#pb').textContent='▶️'}}
function st(d){const j=qi+d;if(pq&&j>=0&&j<pq.ay.length){qi=j;go()}}
function dlLabel(){const b=$('#dlb');if(b)b.textContent=S.dl&&S.dl[rec()+':'+cur.n]?'✅ الصوت محمّل (اضغط للمسح)':'⬇️ تحميل الصوت'}
async function dl(n){const b=$('#dlb'),key=rec()+':'+n,ay=D[n-1].a,c=await caches.open('aud');
if(S.dl&&S.dl[key]){if(!confirm('مسح الصوت المحمّل لهذه السورة؟'))return;await Promise.all(ay.map(a=>c.delete(url(a[4]))));delete S.dl[key];save();return dlLabel()}
b.disabled=true;let done=0,fail=0;const q=ay.slice();
const w=async()=>{while(q.length){const u=url(q.shift()[4]);try{if(!(await c.match(u))){const r=await fetch(u);if(!r.ok)throw 0;await c.put(u,r)}}catch(e){fail++}done++;b.textContent=`⏳ ${ar(done)}/${ar(ay.length)}`}};
await Promise.all([w(),w(),w()]);b.disabled=false;
if(fail){b.textContent=`⚠️ فشل ${ar(fail)} آية — أعد المحاولة`}else{S.dl=S.dl||{};S.dl[key]=1;save();dlLabel();toast('تم تحميل الصوت ✅')}}
/* ===== البحث (أوفلاين) ===== */
let IX=null;
function search(){$('#main').innerHTML='<input id=sq placeholder="اكتب كلمة أو جزء من آية…" onkeydown="if(event.key==\'Enter\')doS()"><div class=bt style="margin:8px 0"><button class=on onclick="doS()" style="padding:10px 18px">بحث</button></div><div id=sr></div>'}
function doS(){const q=nz($('#sq').value.trim());if(!q)return;
if(!IX){IX=[];D.forEach(s=>s.a.forEach((a,i)=>IX.push([nz(a[0]),s.n,i+1,a[0]])))}
const m=IX.filter(x=>x[0].includes(q));
$('#sr').innerHTML=`<p>${ar(m.length)} نتيجة${m.length>80?' (أول ٨٠)':''}</p>`+m.slice(0,80).map(x=>`<div class=card onclick="openS(${x[1]},${x[2]})"><div class=z>${x[3]}</div><small>${D[x[1]-1].name} — آية ${ar(x[2])}</small></div>`).join('')}
/* ===== الأذكار ===== */
const AZ=[["آية الكرسي","اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ ۚ لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ ۚ لَهُ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ ۗ مَن ذَا الَّذِي يَشْفَعُ عِندَهُ إِلَّا بِإِذْنِهِ ۚ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ ۖ وَلَا يُحِيطُونَ بِشَيْءٍ مِّنْ عِلْمِهِ إِلَّا بِمَا شَاءَ ۚ وَسِعَ كُرْسِيُّهُ السَّمَاوَاتِ وَالْأَرْضَ ۖ وَلَا يَئُودُهُ حِفْظُهُمَا ۚ وَهُوَ الْعَلِيُّ الْعَظِيمُ",1],
["المعوذات","قُلْ هُوَ اللَّهُ أَحَدٌ، قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ، قُلْ أَعُوذُ بِرَبِّ النَّاسِ",3],
["أذكار الصباح","أَصْبَحْنَا وَأَصْبَحَ الْمُلْكُ لِلَّهِ، وَالْحَمْدُ لِلَّهِ، لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ (وفي المساء: أَمْسَيْنَا وَأَمْسَى الْمُلْكُ لِلَّهِ)",1],
["اللهم بك أصبحنا","اللَّهُمَّ بِكَ أَصْبَحْنَا، وَبِكَ أَمْسَيْنَا، وَبِكَ نَحْيَا، وَبِكَ نَمُوتُ، وَإِلَيْكَ النُّشُورُ (وفي المساء: وَإِلَيْكَ الْمَصِيرُ)",1],
["سيد الاستغفار","اللَّهُمَّ أَنْتَ رَبِّي لَا إِلَهَ إِلَّا أَنْتَ، خَلَقْتَنِي وَأَنَا عَبْدُكَ، وَأَنَا عَلَى عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ، أَعُوذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ، أَبُوءُ لَكَ بِنِعْمَتِكَ عَلَيَّ، وَأَبُوءُ بِذَنْبِي فَاغْفِرْ لِي فَإِنَّهُ لَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ",1],
["الرضا","رَضِيتُ بِاللَّهِ رَبًّا، وَبِالْإِسْلَامِ دِينًا، وَبِمُحَمَّدٍ نَبِيًّا",3],
["الحفظ من الضرر","بِسْمِ اللَّهِ الَّذِي لَا يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الْأَرْضِ وَلَا فِي السَّمَاءِ وَهُوَ السَّمِيعُ الْعَلِيمُ",3],
["التعوذ بكلمات الله","أَعُوذُ بِكَلِمَاتِ اللَّهِ التَّامَّاتِ مِنْ شَرِّ مَا خَلَقَ",3],
["التسبيح","سُبْحَانَ اللَّهِ وَبِحَمْدِهِ",100],
["الاستغفار","أَسْتَغْفِرُ اللَّهَ وَأَتُوبُ إِلَيْهِ",100],
["الصلاة على النبي","اللَّهُمَّ صَلِّ وَسَلِّمْ عَلَى نَبِيِّنَا مُحَمَّدٍ",10]];
let ac={};
function azkar(){ac={};$('#main').innerHTML='<p class=c>اضغط على الذكر لتعدّ التكرار</p>'+AZ.map((z,i)=>`<div class=card onclick="az(${i})"><b>${z[0]}</b><div class=z>${z[1]}</div><div class=c id=z${i}>${ar(z[2])}</div></div>`).join('')}
function az(i){ac[i]=ac[i]==null?AZ[i][2]:ac[i];if(ac[i]>0)ac[i]--;$('#z'+i).textContent=ac[i]?ar(ac[i]):'✅';try{navigator.vibrate(20)}catch(x){}}
/* ===== المواقيت (حساب محلي بدون إنترنت — الهيئة المصرية) ===== */
const CT={'القاهرة':[30.0444,31.2357],'الجيزة':[30.0131,31.2089],'الإسكندرية':[31.2001,29.9187],'الأقصر':[25.6872,32.6396],'أسوان':[24.0889,32.8998],'المنصورة':[31.0409,31.3785],'طنطا':[30.7865,31.0004],'بورسعيد':[31.2653,32.3019],'السويس':[29.9668,32.5498],'الإسماعيلية':[30.5965,32.2715],'أسيوط':[27.1809,31.1837],'المنيا':[28.1099,30.7503],'الفيوم':[29.3084,30.8428],'شرم الشيخ':[27.9158,34.33],'الغردقة':[27.2579,33.8116]};
function times(){const c=S.city&&CT[S.city]?S.city:'القاهرة',p=CT[c];
const T=new adhan.PrayerTimes(new adhan.Coordinates(p[0],p[1]),new Date(),adhan.CalculationMethod.Egyptian());
const L=[['الفجر',T.fajr],['الشروق',T.sunrise],['الظهر',T.dhuhr],['العصر',T.asr],['المغرب',T.maghrib],['العشاء',T.isha]],now=new Date(),nx=L.findIndex(x=>x[1]>now);
const f=d=>{let h=d.getHours(),m=d.getMinutes();return ar(h%12||12)+':'+ar(String(m).padStart(2,'0'))+' '+(h<12?'ص':'م')};
$('#main').innerHTML=`<select onchange="S.city=this.value;save();times()">${Object.keys(CT).map(k=>`<option ${k==c?'selected':''}>${k}</option>`).join('')}</select>`+L.map((x,i)=>`<div class="card sr ${i==nx?'hl':''}"><b>${x[0]}</b><small style="font-size:18px;opacity:1">${f(x[1])}</small></div>`).join('')+'<p class=c style="opacity:.7">الحساب بطريقة الهيئة المصرية العامة للمساحة · بيشتغل بدون إنترنت</p>'}
function tasbih(){$('#main').innerHTML=`<button class=big onclick="S.t=(S.t||0)+1;save();this.textContent=ar(S.t);try{navigator.vibrate(15)}catch(e){}">${ar(S.t||0)}</button><div class=c><button onclick="S.t=0;save();tasbih()" style="padding:10px 20px;border-radius:10px;border:1px solid var(--b);background:var(--c);color:var(--fg)">تصفير</button></div>`}
nav('home');
</script></body></html>
